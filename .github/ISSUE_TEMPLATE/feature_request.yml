name: Feature idea
description: Suggest something that would make PassVault better
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      placeholder: "I keep forgetting which email I used for…"
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
