name: Release

# Push a tag like v1.0.0 -> tests run, a signed release APK is built and attached to a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Version from tag
        run: echo "PASSVAULT_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KEYSTORE_BASE64 is missing (see README → Releases)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "PASSVAULT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          PASSVAULT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PASSVAULT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PASSVAULT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK and write checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PassVault-v${PASSVAULT_VERSION_NAME}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="$PASSVAULT_VERSION_NAME" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' ../CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          {
            echo ""
            echo "---"
            echo "**Install:** download \`PassVault-v${PASSVAULT_VERSION_NAME}.apk\` below on your Android phone (Android 9+) and open it."
            echo "**Verify:** compare its SHA-256 with \`SHA256SUMS.txt\`."
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PassVault ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            android/dist/PassVault-*.apk
            android/dist/SHA256SUMS.txt
          make_latest: true
