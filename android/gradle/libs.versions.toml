room = "2.7.0"
sqlcipher = "4.6.1"
biometric = "1.1.0"
datastore = "1.1.7"
okhttp = "4.12.0"
gson = "2.10.1"
bouncycastle = "1.78.1"
workRuntime = "2.11.2"
camerax = "1.4.1"
zxing = "3.5.3"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
