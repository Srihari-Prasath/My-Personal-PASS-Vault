<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Backup flow: the vault is encrypted on the phone, the encrypted file goes to my Telegram bot, and a new phone restores it with the master password">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171A21"/>
      <stop offset="100%" stop-color="#1D2233"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B85FF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>
    <path id="p1" d="M190,120 L420,120"/>
    <path id="p2" d="M580,120 L810,120"/>
    <path id="p3" d="M890,175 C890,265 110,265 110,175"/>
  </defs>

  <rect width="1000" height="300" rx="24" fill="url(#card)"/>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#E6E8EF" text-anchor="middle">

    <!-- tracks -->
    <use href="#p1" stroke="#3A404D" stroke-width="3" stroke-dasharray="8 8" fill="none"/>
    <use href="#p2" stroke="#3A404D" stroke-width="3" stroke-dasharray="8 8" fill="none"/>
    <use href="#p3" stroke="#3A404D" stroke-width="2" stroke-dasharray="4 8" fill="none"/>

    <!-- phone -->
    <g transform="translate(110 120)">
      <rect x="-42" y="-68" width="84" height="136" rx="16" fill="#252A34" stroke="#8B85FF" stroke-width="2"/>
      <rect x="-30" y="-46" width="60" height="10" rx="5" fill="#8B85FF" opacity="0.8"/>
      <rect x="-30" y="-28" width="44" height="10" rx="5" fill="#8B85FF" opacity="0.5"/>
      <rect x="-30" y="-10" width="52" height="10" rx="5" fill="#8B85FF" opacity="0.5"/>
      <rect x="-30" y="8" width="36" height="10" rx="5" fill="#8B85FF" opacity="0.5"/>
      <text y="96" font-size="16" font-weight="700">My phone</text>
      <text y="116" font-size="12" fill="#9DA3B4">the only place with plaintext</text>
    </g>

    <!-- encrypt -->
    <g transform="translate(500 120)">
      <circle r="58" fill="url(#indigo)">
        <animate attributeName="r" values="56;60;56" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <rect x="-18" y="-6" width="36" height="28" rx="5" fill="#FFFFFF"/>
      <path d="M-11,-6 L-11,-16 C-11,-30 11,-30 11,-16 L11,-6" fill="none" stroke="#FFFFFF" stroke-width="5"/>
      <circle cy="7" r="4" fill="#4F46E5"/>
      <text y="96" font-size="16" font-weight="700">Encrypted on the phone</text>
      <text y="116" font-size="12" fill="#9DA3B4">Argon2id + AES-256-GCM</text>
    </g>

    <!-- telegram -->
    <g transform="translate(890 120)">
      <circle r="52" fill="url(#tg)"/>
      <path d="M-24,2 L24,-18 L14,22 L2,10 L-6,18 L-6,6 Z" fill="#FFFFFF"/>
      <text y="96" font-size="16" font-weight="700">My Telegram bot</text>
      <text y="116" font-size="12" fill="#9DA3B4">newest .pvlt pinned</text>
    </g>

    <!-- plaintext packet: phone -> encrypt -->
    <g>
      <rect x="-22" y="-13" width="44" height="26" rx="7" fill="#F08C00"/>
      <text y="5" font-size="12" font-weight="700" fill="#1A1206">abc</text>
      <animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#p1"/></animateMotion>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.48;0.5;1" dur="3s" repeatCount="indefinite"/>
    </g>

    <!-- encrypted packet: encrypt -> telegram -->
    <g opacity="0">
      <rect x="-22" y="-13" width="44" height="26" rx="7" fill="#8B85FF"/>
      <text y="5" font-size="12" font-weight="700" fill="#14104A">#$%</text>
      <animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;0;1" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#p2"/></animateMotion>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.52;0.98;1" dur="3s" repeatCount="indefinite"/>
    </g>

    <!-- restore packet: telegram -> new phone -->
    <g>
      <circle r="7" fill="#4FD6C3"/>
      <animateMotion dur="6s" repeatCount="indefinite" begin="1s"><mpath href="#p3"/></animateMotion>
    </g>
    <text x="500" y="282" font-size="13" fill="#4FD6C3">New phone? Restore with just the bot + my master password</text>
  </g>
</svg>
